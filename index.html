<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home-Classroom</title>
  <style>
    html, body, #player-container {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      color: #ffffff;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    ruffle-player {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div id="player-container" style="padding: 20px;">Loading Game...</div>
  <script src="./ruffle.js"></script>
  <script>
    window.addEventListener("DOMContentLoaded", function () {
      var container = document.getElementById("player-container");
      var ruffle = window.RufflePlayer.newest();
      var player = ruffle.createPlayer();
      container.innerHTML = "";
      container.appendChild(player);
      player.load("https://catbox.moe").catch(function (err) {
        container.innerHTML = "<div style='padding:20px;'>Catbox Error: " + err + "</div>";
      });
    });
  </script>
</body>
</html>
